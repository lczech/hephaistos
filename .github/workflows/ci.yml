name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # floor and newest; bump by hand
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - run: uv run --locked pytest

  # The GUI: lint, types, tests (some in real browsers) and the build, which compiles every
  # component with React's compiler and fails on any it can't (gui/web/vite.config.ts).
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run npm --prefix gui ci
      - run: uv run npm --prefix gui run fetch-browsers -- --with-deps  # and their system libraries
      - run: uv run npm --prefix gui run lint
      - run: uv run npm --prefix gui run check
      - run: uv run npm --prefix gui run build

  git-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/cache@v6
        with:
          path: ~/.cache/hephaistos/git
          key: git-${{ runner.os }}-${{ hashFiles('scripts/test_git_versions.sh') }}
      - run: uv sync --locked
      - run: scripts/test_git_versions.sh
