[project]
name = "hephaistos"
version = "0.1.0"
description = "A workbench for managing repositories, terminals, and agents across distributed machines."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Lucas Czech", email = "luc.czech@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15",
    "fastapi>=0.143",
    "typer>=0.27",
    "uvicorn>=0.54",
    "websockets>=17.2",
]

[project.scripts]
hephaistos = "hephaistos.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4",
    "ruff>=0.13",
    "pyright>=1.1.400",
    "httpx2>=2.13",
    "nodejs-wheel>=24.19.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing commas: conflicts with the formatter
    "CPY001",  # copyright notice in every file
    "D100",    # module docstrings
    "D104",    # package docstrings
    "D203",    # blank line before class docstring: conflicts with D211
    "D213",    # multi-line docstring summary on the second line: conflicts with D212
    "D401",    # imperative mood: our docstrings describe ("The Machine with this ID")
    "D404",    # docstrings starting with "This"
    "EM101",   # messages directly in `raise`: purely stylistic
    "EM102",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "INP001",   # scripts are not packages
    "T201",     # scripts print their results
]
"tests/**" = [
    "D",        # test names describe the test
    "INP001",   # test directories are not packages
    "PLR2004",  # literal values are the point of tests
    "S101",     # pytest uses assert
    "S603",     # tests run git directly
    "S607",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src", "tests"]
# The project's environment, however Pyright is started; otherwise it uses the `python` on PATH,
# which is the system's outside `uv run`.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUninitializedInstanceVariable = "error"
reportPropertyTypeMismatch = "error"
reportImportCycles = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # for the helpers in tests/support.py
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
timeout = 120  # seconds: a hanging test fails, rather than stalling the run
